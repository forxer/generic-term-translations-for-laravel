name: tests

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

      - name: Check code style
        if: matrix.php == '8.4'
        run: vendor/bin/pint --test

      # Must stay after the test suite: regenerating first would hide a stale
      # GLOSSARY.md from GlossaryUpToDateTest.
      - name: Run the glossary generator
        run: composer glossary
